ID: FAST
_schema-version: '2.1'
version: 0.4.4
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
   - builder: custom
     commands:
    #  will remove csv files when deploying to production landscape to not delete the existing data
      - npx rimraf db/csv
      - npm install --production
      - npm run build:prd
      # - npx -p @sap/cds-dk cds -v
      # - npx -p @sap/cds-dk@4.9.7 cds build --production

modules:
  - name: FAST-db
    type: hdb
    path: db
    build-parameters:
      builder: custom
      commands: [] 
      ignore:
        - node_modules/
    parameters:
      memory: 256M
      disk-quota: 1024M
    requires:
      - name: FAST-db-hdi-container
  - name: FAST-srv
    type: nodejs
    path: srv
    build-parameters:
      builder: custom
      commands: [] 
      ignore:
        - node_modules/
    parameters:
      memory: 4096M
      disk-quota: 4096M
      health-check-timeout: 120
    provides:
      - name: srv_api
        public: true
        properties:
          url: ${default-url}
    requires:
      - name: FAST-db-hdi-container
      - name: uaa_FAST
      - name: FAST-logging
  - name: FAST-API-AppRouter
    type: html5
    path: app
    build-parameters:
      builder: custom
      commands: [] 
      ignore:
        - node_modules/
    requires:
      - name: srv_api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv_api
          url: '~{url}'
          timeout: 120000
      - name: uaa_FAST
      - name: FAST-logging

resources:
  - name: FAST-db-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
    properties:
      hdi-container-name: '${service-name}'
  - name: uaa_FAST
    parameters:
      path: ./xs-security.json
      service-plan: application
      service: xsuaa
    type: org.cloudfoundry.managed-service
  - name: FAST-logging
    type: org.cloudfoundry.managed-service
    parameters:
       service: application-logs
       service-plan: lite
