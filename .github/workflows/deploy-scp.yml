# This is a basic workflow to help you get started with Actions

name: Deploy to CF MTA DEVELOPMENT

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 12
      - name: Install MTA Build Tool
        run: npm install -g mbt
      - name: Install CDS tool
        run: npm i -g @sap/cds-dk
      - name: Build MTA
        run: npm run build:cf
      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: FASTCAP-Backend-CF
          path: ./mta_archives/FASTCAP-Backend-CF.mtar
  deploy:
     needs: build
     runs-on: ubuntu-latest
     steps:
       - name: Download Artifact
         uses: actions/download-artifact@v2
         with:
           name: FASTCAP-Backend-CF
           path: ./
       - name: Deploy to Cloud Foundry
         uses: guerric-p/cf-cli-action@master
         with:
           cf_api: ${{ secrets.CF_API }}
           cf_username: ${{ secrets.CF_USERNAME }}
           cf_password: ${{ secrets.CF_PASSWORD }}
           cf_org: ${{ secrets.CF_ORG }}
           cf_space: ${{ secrets.CF_SPACE }}
           command: deploy ./FASTCAP-Backend-CF.mtar -f -e ./cf.mtaext