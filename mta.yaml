ID: FAST
_schema-version: '2.1'
version: 0.4.2
modules:
  - name: FAST-db
    type: hdb
    path: db
    parameters:
      memory: 256M
      disk-quota: 1024M
    requires:
      - name: FAST-db-hdi-container
  - name: FAST-srv
    type: nodejs
    path: srv
    parameters:
      memory: 512M
      disk-quota: 1024M
    provides:
      - name: srv_api
        public: true
        properties:
          url: ${default-url}
    requires:
      - name: FAST-db-hdi-container
      - name: uaa_FAST
  - name: FAST-API-AppRouter
    type: html5
    path: app
    requires:
      - name: srv_api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv_api
          url: '~{url}'
      - name: uaa_FAST
resources:
  - name: FAST-db-hdi-container
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
    properties:
      hdi-container-name: '${service-name}'
  - name: uaa_FAST
    parameters:
      path: ./xs-security.json
      service-plan: default
      service: xsuaa
    type: org.cloudfoundry.managed-service
